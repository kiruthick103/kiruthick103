<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <radialGradient id="batBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1136" />
      <stop offset="50%" stop-color="#0e071a" />
      <stop offset="100%" stop-color="#05030a" />
    </radialGradient>
    <linearGradient id="purpleRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="purpleGlowTactical">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .tactical-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', monospace; }
    .tactical-head { font-weight: 900; letter-spacing: 3px; }
  </style>

  <!-- Base Panel -->
  <rect width="880" height="260" rx="14" fill="url(#batBg)" stroke="#581c87" stroke-width="1.5" />

  <!-- Subtle Tactical Halftone / Dot Grid -->
  <g opacity="0.08" fill="#c084fc">
    <circle cx="40" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="160" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="240" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="320" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="400" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/><circle cx="480" cy="40" r="1.5"/><circle cx="520" cy="40" r="1.5"/><circle cx="560" cy="40" r="1.5"/><circle cx="600" cy="40" r="1.5"/><circle cx="640" cy="40" r="1.5"/><circle cx="680" cy="40" r="1.5"/><circle cx="720" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/><circle cx="800" cy="40" r="1.5"/><circle cx="840" cy="40" r="1.5"/>
    <circle cx="40" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/><circle cx="120" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="200" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="280" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="360" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/><circle cx="440" cy="80" r="1.5"/><circle cx="480" cy="80" r="1.5"/><circle cx="520" cy="80" r="1.5"/><circle cx="560" cy="80" r="1.5"/><circle cx="600" cy="80" r="1.5"/><circle cx="640" cy="80" r="1.5"/><circle cx="680" cy="80" r="1.5"/><circle cx="720" cy="80" r="1.5"/><circle cx="760" cy="80" r="1.5"/><circle cx="800" cy="80" r="1.5"/><circle cx="840" cy="80" r="1.5"/>
    <circle cx="40" cy="180" r="1.5"/><circle cx="80" cy="180" r="1.5"/><circle cx="120" cy="180" r="1.5"/><circle cx="160" cy="180" r="1.5"/><circle cx="200" cy="180" r="1.5"/><circle cx="240" cy="180" r="1.5"/><circle cx="280" cy="180" r="1.5"/><circle cx="320" cy="180" r="1.5"/><circle cx="360" cy="180" r="1.5"/><circle cx="400" cy="180" r="1.5"/><circle cx="440" cy="180" r="1.5"/><circle cx="480" cy="180" r="1.5"/><circle cx="520" cy="180" r="1.5"/><circle cx="560" cy="180" r="1.5"/><circle cx="600" cy="180" r="1.5"/><circle cx="640" cy="180" r="1.5"/><circle cx="680" cy="180" r="1.5"/><circle cx="720" cy="180" r="1.5"/><circle cx="760" cy="180" r="1.5"/><circle cx="800" cy="180" r="1.5"/><circle cx="840" cy="180" r="1.5"/>
