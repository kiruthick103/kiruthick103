<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="30%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#140728" />
      <stop offset="50%" stop-color="#0a0316" />
      <stop offset="100%" stop-color="#040108" />
    </radialGradient>
    <radialGradient id="greenGlow" cx="72%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#059669" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter Glows -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', 'Roboto', 'Courier New', monospace; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 900; letter-spacing: 4px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 700; letter-spacing: 2px; }
    .badge { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
  </style>

  <!-- Background Layer -->
  <rect width="920" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="920" height="380" rx="16" fill="url(#purpleGlow)" />
  <rect width="920" height="380" rx="16" fill="url(#greenGlow)" />

  <!-- Outer HUD Frame -->
  <rect x="14" y="14" width="892" height="352" rx="12" fill="none" stroke="url(#hudBorder)" stroke-width="1.2" stroke-opacity="0.4" />
  <rect x="22" y="22" width="876" height="336" rx="8" fill="none" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="4,6" />

  <!-- Cyberpunk Grid Lines -->
  <g opacity="0.08" stroke="#00ff88" stroke-width="0.8">
    <line x1="40" y1="90" x2="880" y2="90" />
    <line x1="40" y1="160" x2="880" y2="160" />
    <line x1="40" y1="230" x2="880" y2="230" />
    <line x1="40" y1="300" x2="880" y2="300" />
    <line x1="200" y1="40" x2="200" y2="340" />
    <line x1="400" y1="40" x2="400" y2="340" />
    <line x1="600" y1="40" x2="600" y2="340" />
  </g>

  <!-- HUD Corner Calipers & Accents -->
  <!-- Top-Left -->
  <path d="M 14 45 L 14 14 L 45 14" fill="none" stroke="#00ff88" stroke-width="3" filter="url(#glowGreen)" />
  <!-- Top-Right -->
  <path d="M 906 45 L 906 14 L 875 14" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#glowPurple)" />
  <!-- Bottom-Left -->
  <path d="M 14 335 L 14 366 L 45 366" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#glowPurple)" />
  <!-- Bottom-Right -->
  <path d="M 906 335 L 906 366 L 875 366" fill="none" stroke="#00ff88" stroke-width="3" filter="url(#glowGreen)" />

  <!-- Red & Cyan subtle accent notches -->
  <rect x="80" y="14" width="24" height="3" fill="#ff0055" />
  <rect x="110" y="14" width="12" height="3" fill="#00f5ff" />
  <rect x="810" y="363" width="24" height="3" fill="#00f5ff" />
  <rect x="790" y="363" width="12" height="3" fill="#ff0055" />

  <!-- Status / Telemetry Top Bar -->
  <g class="mono" fill="#00ff88" font-size="10" opacity="0.85" letter-spacing="1.5">
    <circle cx="50" cy="46" r="3.5" fill="#00ff88" filter="url(#glowGreen)" />
    <text x="62" y="50">SYSTEM: ONLINE</text>
    <text x="210" y="50" fill="#a855f7">IDENTITY: KIRUTHICK103</text>
    <text x="430" y="50" fill="#00f5ff">LATENCY: 0.12ms</text>
    <text x="760" y="50" fill="#ff0055">MODE: BUILD_v4.0</text>
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(52, 100)">
    <!-- Small Tag -->
    <rect x="0" y="0" width="165" height="22" rx="4" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" />
    <text x="10" y="15" fill="#c084fc" class="mono badge">⚡ MULTIVERSE STACK</text>

    <!-- Main Name -->
    <text x="0" y="66" fill="url(#textGrad)" class="title" font-size="44" filter="url(#glowPurple)">KIRUTHICK SM</text>

    <!-- Role Subtitle -->
    <text x="0" y="102" fill="url(#emeraldGrad)" class="sub" font-size="18" filter="url(#glowGreen)">
      AI/ML  •  SOFTWARE  •  ROBOTICS
    </text>

    <!-- Mission Statement Quote -->
    <text x="0" y="136" fill="#94a3b8" class="mono" font-size="13.5" font-weight="400">
      "Building intelligent systems at the intersection of
    </text>
    <text x="0" y="158" fill="#e2e8f0" class="mono" font-size="13.5" font-weight="600">
      code, AI and the physical world."
    </text>

    <!-- HUD Feature Badges -->
    <g transform="translate(0, 184)">
      <!-- Badge 1 -->
      <g>
        <rect x="0" y="0" width="105" height="28" rx="6" fill="#0a1912" stroke="#00ff88" stroke-width="1" />
        <circle cx="14" cy="14" r="3" fill="#00ff88" filter="url(#glowGreen)" />
        <text x="26" y="18" fill="#00ff88" class="mono" font-size="10.5" font-weight="700">AI LAB</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(114, 0)">
        <rect x="0" y="0" width="118" height="28" rx="6" fill="#180b2c" stroke="#a855f7" stroke-width="1" />
        <circle cx="14" cy="14" r="3" fill="#a855f7" filter="url(#glowPurple)" />
        <text x="26" y="18" fill="#c084fc" class="mono" font-size="10.5" font-weight="700">ROBOTICS</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#061b24" stroke="#00f5ff" stroke-width="1" />
        <circle cx="14" cy="14" r="3" fill="#00f5ff" />
        <text x="26" y="18" fill="#38bdf8" class="mono" font-size="10.5" font-weight="700">F1 TELEMETRY</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(386, 0)">
        <rect x="0" y="0" width="100" height="28" rx="6" fill="#200612" stroke="#ff0055" stroke-width="1" />
        <circle cx="14" cy="14" r="3" fill="#ff0055" />
        <text x="26" y="18" fill="#fb7185" class="mono" font-size="10.5" font-weight="700">SECURITY</text>
      </g>
    </g>
  </g>

  <!-- RIGHT HERO SECTION: LARGE GLOWING GREEN LANTERN ENERGY RING -->
  <g transform="translate(710, 195)">
    <!-- Outer Ambient Radial Aura -->
    <circle cx="0" cy="0" r="145" fill="#00ff88" fill-opacity="0.06" filter="url(#glowGreen)" />
    <circle cx="0" cy="0" r="120" fill="#059669" fill-opacity="0.10" />

    <!-- Orbital Energy Waves / Arcs -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="10,18" />
    <circle cx="0" cy="0" r="92" fill="none" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="60,20,10,20" />
    <circle cx="0" cy="0" r="82" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="30,45" />

    <!-- MAIN EMERALD POWER RING (Green Lantern Core) -->
    <!-- Outer Ring Band -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00ff88" stroke-width="5" filter="url(#glowGreen)" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
    
    <!-- Power Notches on Ring -->
    <rect x="-4" y="-76" width="8" height="12" fill="#00ff88" filter="url(#glowGreen)" rx="2" />
    <rect x="-4" y="64" width="8" height="12" fill="#00ff88" filter="url(#glowGreen)" rx="2" />
    <rect x="-76" y="-4" width="12" height="8" fill="#00ff88" filter="url(#glowGreen)" rx="2" />
    <rect x="64" y="-4" width="12" height="8" fill="#00ff88" filter="url(#glowGreen)" rx="2" />

    <!-- Green Lantern Battery Emblem Graphic -->
    <!-- Center Lantern Top Bar -->
    <path d="M -30 -35 L 30 -35 L 24 -24 L -24 -24 Z" fill="#00ff88" filter="url(#glowGreen)" opacity="0.9" />
    <!-- Center Lantern Bottom Bar -->
    <path d="M -30 35 L 30 35 L 24 24 L -24 24 Z" fill="#00ff88" filter="url(#glowGreen)" opacity="0.9" />
    
    <!-- Central Energy Core Circle -->
    <circle cx="0" cy="0" r="42" fill="#041a12" stroke="#00ff88" stroke-width="3" filter="url(#glowGreen)" />
    <circle cx="0" cy="0" r="32" fill="#03251a" fill-opacity="0.8" />

    <!-- Text Inside Ring: < CODE > -->
    <text x="0" y="8" fill="#ffffff" class="mono" font-size="18" font-weight="900" text-anchor="middle" filter="url(#glowGreen)" letter-spacing="2">
      &lt; CODE &gt;
    </text>

    <!-- Orbiting Energy Spark Nodes -->
    <circle cx="-75" cy="-55" r="4" fill="#00ff88" filter="url(#glowGreen)" />
    <circle cx="85" cy="-35" r="3" fill="#00f5ff" />
    <circle cx="70" cy="65" r="4.5" fill="#00ff88" filter="url(#glowGreen)" />
    <circle cx="-80" cy="45" r="3" fill="#a855f7" filter="url(#glowPurple)" />

    <!-- Ring Coordinates / Status -->
    <text x="0" y="118" fill="#00ff88" class="mono" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="3" filter="url(#glowGreen)">
      WILLPOWER CORE // 100%
    </text>
  </g>

  <!-- Bottom HUD Status Telemetry -->
  <g class="mono" fill="#64748b" font-size="9.5" letter-spacing="1">
    <text x="40" y="352">SEC_PROTOCOL: ACTIVE</text>
    <text x="260" y="352">STACK: FULL_SPECTRUM</text>
    <text x="480" y="352">LOCATION: CHENNAI_NODE</text>
    <text x="730" y="352" fill="#00ff88">STATUS: READY TO DEPLOY</text>
  </g>
</svg>
