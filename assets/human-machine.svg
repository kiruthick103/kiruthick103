<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <radialGradient id="cyborgBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1926" />
      <stop offset="60%" stop-color="#050e17" />
      <stop offset="100%" stop-color="#020508" />
    </radialGradient>
    <filter id="cyanNeon">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .cyb-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', monospace; }
  </style>

  <rect width="880" height="230" rx="14" fill="url(#cyborgBg)" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Circuit traces -->
  <g stroke="#00f5ff" stroke-width="1" stroke-opacity="0.25" fill="none">
    <path d="M 40 40 H 120 L 140 60 H 260" />
    <path d="M 840 40 H 760 L 740 60 H 620" />
    <path d="M 40 190 H 120 L 140 170 H 260" />
    <path d="M 840 190 H 760 L 740 170 H 620" />
    <circle cx="120" cy="40" r="2.5" fill="#00f5ff" />
    <circle cx="760" cy="40" r="2.5" fill="#00f5ff" />
    <circle cx="120" cy="190" r="2.5" fill="#00f5ff" />
    <circle cx="760" cy="190" r="2.5" fill="#00f5ff" />
  </g>

  <!-- Section Header -->
  <g transform="translate(30, 36)">
    <text x="0" y="5" fill="#38bdf8" class="cyb-mono" font-size="15" font-weight="900" letter-spacing="3">CYBORG // BIONIC SYNTHESIS: HUMAN × MACHINE</text>
    <text x="630" y="5" fill="#00ff88" class="cyb-mono" font-size="10.5" font-weight="700">PHYSICAL_DIGITAL_SYNC: 100%</text>
  </g>

  <!-- 6 Cybernetic Modules -->
  <!-- 1: AI -->
  <g transform="translate(30, 70)">
    <rect width="125" height="130" rx="8" fill="#031622" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="20" cy="22" r="3.5" fill="#00ff88" />
    <text x="32" y="26" fill="#38bdf8" class="cyb-mono" font-size="12" font-weight="800">AI</text>
    <text x="14" y="58" fill="#e2e8f0" class="cyb-mono" font-size="10.5" font-weight="600">Intelligence</text>
    <text x="14" y="76" fill="#94a3b8" class="cyb-mono" font-size="9.5">Neural Nets</text>
    <text x="14" y="94" fill="#94a3b8" class="cyb-mono" font-size="9.5">Reasoning</text>
    <text x="14" y="116" fill="#00ff88" class="cyb-mono" font-size="8.5" font-weight="700">STATUS: ON</text>
  </g>

  <!-- 2: ROBOTICS -->
  <g transform="translate(170, 70)">
    <rect width="125" height="130" rx="8" fill="#031622" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="20" cy="22" r="3.5" fill="#00ff88" />
    <text x="32" y="26" fill="#38bdf8" class="cyb-mono" font-size="12" font-weight="800">ROBOTICS</text>
    <text x="14" y="58" fill="#e2e8f0" class="cyb-mono" font-size="10.5" font-weight="600">Hardware</text>
    <text x="14" y="76" fill="#94a3b8" class="cyb-mono" font-size="9.5">Actuators</text>
    <text x="14" y="94" fill="#94a3b8" class="cyb-mono" font-size="9.5">Kinematics</text>
    <text x="14" y="116" fill="#00ff88" class="cyb-mono" font-size="8.5" font-weight="700">STATUS: ON</text>
  </g>

  <!-- 3: IOT -->
  <g transform="translate(310, 70)">
    <rect width="125" height="130" rx="8" fill="#031622" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="20" cy="22" r="3.5" fill="#00ff88" />
    <text x="32" y="26" fill="#38bdf8" class="cyb-mono" font-size="12" font-weight="800">IoT</text>
    <text x="14" y="58" fill="#e2e8f0" class="cyb-mono" font-size="10.5" font-weight="600">Embedded</text>
    <text x="14" y="76" fill="#94a3b8" class="cyb-mono" font-size="9.5">Edge Sensors</text>
    <text x="14" y="94" fill="#94a3b8" class="cyb-mono" font-size="9.5">Streams</text>
    <text x="14" y="116" fill="#00ff88" class="cyb-mono" font-size="8.5" font-weight="700">STATUS: ON</text>
  </g>

  <!-- 4: COMPUTER VISION -->
  <g transform="translate(450, 70)">
    <rect width="125" height="130" rx="8" fill="#031622" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="20" cy="22" r="3.5" fill="#00ff88" />
    <text x="32" y="26" fill="#38bdf8" class="cyb-mono" font-size="11" font-weight="800">CV / VISION</text>
    <text x="14" y="58" fill="#e2e8f0" class="cyb-mono" font-size="10.5" font-weight="600">Perception</text>
    <text x="14" y="76" fill="#94a3b8" class="cyb-mono" font-size="9.5">OpenCV</text>
    <text x="14" y="94" fill="#94a3b8" class="cyb-mono" font-size="9.5">Object Detect</text>
    <text x="14" y="116" fill="#00ff88" class="cyb-mono" font-size="8.5" font-weight="700">STATUS: ON</text>
  </g>

  <!-- 5: AUTOMATION -->
  <g transform="translate(590, 70)">
    <rect width="125" height="130" rx="8" fill="#031622" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="20" cy="22" r="3.5" fill="#00ff88" />
    <text x="32" y="26" fill="#38bdf8" class="cyb-mono" font-size="11" font-weight="800">AUTOMATION</text>
    <text x="14" y="58" fill="#e2e8f0" class="cyb-mono" font-size="10.5" font-weight="600">Pipelines</text>
    <text x="14" y="76" fill="#94a3b8" class="cyb-mono" font-size="9.5">Workflows</text>
    <text x="14" y="94" fill="#94a3b8" class="cyb-mono" font-size="9.5">Task Runners</text>
    <text x="14" y="116" fill="#00ff88" class="cyb-mono" font-size="8.5" font-weight="700">STATUS: ON</text>
  </g>

  <!-- 6: SOFTWARE -->
  <g transform="translate(730, 70)">
    <rect width="120" height="130" rx="8" fill="#031622" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="20" cy="22" r="3.5" fill="#00ff88" />
    <text x="32" y="26" fill="#38bdf8" class="cyb-mono" font-size="11" font-weight="800">SOFTWARE</text>
    <text x="14" y="58" fill="#e2e8f0" class="cyb-mono" font-size="10.5" font-weight="600">Full Stack</text>
    <text x="14" y="76" fill="#94a3b8" class="cyb-mono" font-size="9.5">APIs / Engines</text>
    <text x="14" y="94" fill="#94a3b8" class="cyb-mono" font-size="9.5">Data Layers</text>
    <text x="14" y="116" fill="#00ff88" class="cyb-mono" font-size="8.5" font-weight="700">STATUS: ON</text>
  </g>
</svg>
