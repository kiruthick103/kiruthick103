<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%">
  <defs>
    <radialGradient id="portalBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e0b38" />
      <stop offset="50%" stop-color="#0e041c" />
      <stop offset="100%" stop-color="#04010a" />
    </radialGradient>
    <radialGradient id="wormhole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="85%" stop-color="#3b0764" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="portalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .portal-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', monospace; }
  </style>

  <!-- Panel Base -->
  <rect width="880" height="270" rx="14" fill="url(#portalBg)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="50" r="1.2" /><circle cx="160" cy="180" r="1.5" /><circle cx="240" cy="80" r="1" />
    <circle cx="700" cy="60" r="1.5" /><circle cx="820" cy="190" r="1.2" /><circle cx="780" cy="120" r="1" />
    <circle cx="340" cy="220" r="1.5" /><circle cx="560" cy="40" r="1.2" />
  </g>

  <!-- Central Stargate Portal -->
  <g transform="translate(440, 135)">
    <!-- Swirling Core Aura -->
    <ellipse cx="0" cy="0" rx="130" ry="70" fill="url(#wormhole)" filter="url(#portalGlow)" />
    <!-- Quantum Horizon Rings -->
    <ellipse cx="0" cy="0" rx="150" ry="85" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="14,10" opacity="0.7" />
    <ellipse cx="0" cy="0" rx="110" ry="60" fill="none" stroke="#00f5ff" stroke-width="2" stroke-dasharray="6,6" filter="url(#portalGlow)" />
    <ellipse cx="0" cy="0" rx="80" ry="40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="6" fill="#ffffff" class="portal-mono" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="3">DIMENSIONAL PORTAL</text>
  </g>

  <!-- 6 Destination Spheres / Gateway Anchors -->
  <!-- Left Side -->
  <g transform="translate(140, 55)">
    <rect x="-100" y="-16" width="200" height="32" rx="16" fill="#140628" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="-80" cy="0" r="4" fill="#c084fc" />
    <text x="5" y="5" fill="#e9d5ff" class="portal-mono" font-size="11.5" font-weight="700" text-anchor="middle">🤖 AI AGENTS</text>
  </g>
  <g transform="translate(120, 135)">
    <rect x="-100" y="-16" width="200" height="32" rx="16" fill="#140628" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="-80" cy="0" r="4" fill="#c084fc" />
    <text x="5" y="5" fill="#e9d5ff" class="portal-mono" font-size="11.5" font-weight="700" text-anchor="middle">✨ GENERATIVE AI</text>
  </g>
  <g transform="translate(140, 215)">
    <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#140628" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="-95" cy="0" r="4" fill="#c084fc" />
    <text x="5" y="5" fill="#e9d5ff" class="portal-mono" font-size="11.5" font-weight="700" text-anchor="middle">👁 ADVANCED VISION</text>
  </g>

  <!-- Right Side -->
  <g transform="translate(740, 55)">
    <rect x="-100" y="-16" width="200" height="32" rx="16" fill="#041a24" stroke="#00f5ff" stroke-width="1.2" />
    <circle cx="-80" cy="0" r="4" fill="#00f5ff" />
    <text x="5" y="5" fill="#67e8f9" class="portal-mono" font-size="11.5" font-weight="700" text-anchor="middle">🦾 ROBOTICS</text>
  </g>
  <g transform="translate(760, 135)">
    <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#041a24" stroke="#00f5ff" stroke-width="1.2" />
    <circle cx="-95" cy="0" r="4" fill="#00f5ff" />
    <text x="5" y="5" fill="#67e8f9" class="portal-mono" font-size="11" font-weight="700" text-anchor="middle">⚡ INTELLIGENT AUTOMATION</text>
  </g>
  <g transform="translate(740, 215)">
    <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#041a24" stroke="#00f5ff" stroke-width="1.2" />
    <circle cx="-95" cy="0" r="4" fill="#00f5ff" />
    <text x="5" y="5" fill="#67e8f9" class="portal-mono" font-size="11" font-weight="700" text-anchor="middle">🌐 FULL STACK SYSTEMS</text>
  </g>
</svg>
