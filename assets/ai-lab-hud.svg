<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <radialGradient id="jarvisBg" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#041824" />
      <stop offset="60%" stop-color="#020d14" />
      <stop offset="100%" stop-color="#01060a" />
    </radialGradient>
    <radialGradient id="arcCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .hud-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', monospace; }
    .hud-head { font-weight: 900; letter-spacing: 4px; }
  </style>

  <!-- Panel Base -->
  <rect width="880" height="280" rx="14" fill="url(#jarvisBg)" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#00f5ff" stroke-width="0.8">
    <line x1="20" y1="70" x2="860" y2="70" />
    <line x1="20" y1="140" x2="860" y2="140" />
    <line x1="20" y1="210" x2="860" y2="210" />
    <line x1="280" y1="20" x2="280" y2="260" stroke-dasharray="4,6" />
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(30, 36)">
    <circle cx="10" cy="0" r="4" fill="#00f5ff" filter="url(#cyanGlow)" />
    <text x="24" y="5" fill="#38bdf8" class="hud-mono hud-head" font-size="16">AI LAB // NEURAL INTELLIGENCE PROTOCOL</text>
    <text x="640" y="5" fill="#eab308" class="hud-mono" font-size="11" font-weight="700">MK-LXXXV // CORE: PEAK</text>
  </g>

  <!-- Arc Reactor Holographic Ring (Left) -->
  <g transform="translate(145, 155)">
    <!-- Ambient Core Pulse -->
    <circle cx="0" cy="0" r="85" fill="url(#arcCore)" filter="url(#cyanGlow)" />
    <!-- Outer Arc segments -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="14,8" />
    <circle cx="0" cy="0" r="66" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="40,25" />
    <!-- Mechanical Segments (10 coils) -->
    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-54" x2="0" y2="-44" />
      <line x1="32" y1="-43" x2="26" y2="-35" />
      <line x1="51" y1="-17" x2="42" y2="-14" />
      <line x1="51" y1="17" x2="42" y2="14" />
      <line x1="32" y1="43" x2="26" y2="35" />
      <line x1="0" y1="54" x2="0" y2="44" />
      <line x1="-32" y1="43" x2="-26" y2="35" />
      <line x1="-51" y1="17" x2="-42" y2="14" />
      <line x1="-51" y1="-17" x2="-42" y2="-14" />
      <line x1="-32" y1="-43" x2="-26" y2="-35" />
    </g>
    <!-- Center Core Triangle/Circle -->
    <circle cx="0" cy="0" r="30" fill="#011927" stroke="#00f5ff" stroke-width="2.5" filter="url(#cyanGlow)" />
    <polygon points="0,-16 14,10 -14,10" fill="none" stroke="#eab308" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#cyanGlow)" />
    <text x="0" y="44" fill="#38bdf8" class="hud-mono" font-size="8.5" text-anchor="middle" letter-spacing="1.5">ARC POWER: 100%</text>
  </g>

  <!-- JARVIS-STYLE HUD STATUS DISPLAY (Center-Right) -->
  <g transform="translate(320, 85)">
    <!-- Header Box -->
    <rect x="0" y="0" width="520" height="28" rx="4" fill="#062235" stroke="#0284c7" stroke-width="1" />
    <text x="14" y="19" fill="#00f5ff" class="hud-mono" font-size="12" font-weight="900" letter-spacing="3">SYSTEM STATUS</text>
    <text x="440" y="19" fill="#eab308" class="hud-mono" font-size="10.5" font-weight="700">ONLINE [5/5]</text>

    <!-- Status Readout Rows -->
    <g transform="translate(0, 42)" class="hud-mono" font-size="13" font-weight="700">
      <!-- Row 1: AI -->
      <g transform="translate(10, 0)">
        <text x="0" y="16" fill="#94a3b8">AI ENGINE</text>
        <line x1="120" y1="12" x2="360" y2="12" stroke="#0c4a6e" stroke-width="1" stroke-dasharray="3,4" />
        <rect x="380" y="2" width="110" height="20" rx="3" fill="#042f2e" stroke="#00ff88" stroke-width="1" />
        <circle cx="392" cy="12" r="3" fill="#00ff88" />
        <text x="404" y="16" fill="#00ff88" font-size="11">ONLINE</text>
      </g>

      <!-- Row 2: VISION -->
      <g transform="translate(10, 30)">
        <text x="0" y="16" fill="#94a3b8">VISION PIPELINE</text>
        <line x1="150" y1="12" x2="360" y2="12" stroke="#0c4a6e" stroke-width="1" stroke-dasharray="3,4" />
        <rect x="380" y="2" width="110" height="20" rx="3" fill="#042f2e" stroke="#00ff88" stroke-width="1" />
        <circle cx="392" cy="12" r="3" fill="#00ff88" />
        <text x="404" y="16" fill="#00ff88" font-size="11">ONLINE</text>
      </g>

      <!-- Row 3: CODE -->
      <g transform="translate(10, 60)">
        <text x="0" y="16" fill="#94a3b8">CODE ARCHITECTURE</text>
        <line x1="180" y1="12" x2="360" y2="12" stroke="#0c4a6e" stroke-width="1" stroke-dasharray="3,4" />
        <rect x="380" y="2" width="110" height="20" rx="3" fill="#042f2e" stroke="#00ff88" stroke-width="1" />
        <circle cx="392" cy="12" r="3" fill="#00ff88" />
        <text x="404" y="16" fill="#00ff88" font-size="11">ONLINE</text>
      </g>

      <!-- Row 4: ROBOTICS -->
      <g transform="translate(10, 90)">
        <text x="0" y="16" fill="#94a3b8">ROBOTICS TELEMETRY</text>
        <line x1="180" y1="12" x2="360" y2="12" stroke="#0c4a6e" stroke-width="1" stroke-dasharray="3,4" />
        <rect x="380" y="2" width="110" height="20" rx="3" fill="#042f2e" stroke="#00ff88" stroke-width="1" />
        <circle cx="392" cy="12" r="3" fill="#00ff88" />
        <text x="404" y="16" fill="#00ff88" font-size="11">ONLINE</text>
      </g>

      <!-- Row 5: BUILD -->
      <g transform="translate(10, 120)">
        <text x="0" y="16" fill="#38bdf8">AUTONOMOUS BUILD</text>
        <line x1="170" y1="12" x2="360" y2="12" stroke="#0c4a6e" stroke-width="1" stroke-dasharray="3,4" />
        <rect x="380" y="2" width="110" height="20" rx="3" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" />
        <circle cx="392" cy="12" r="3" fill="#a855f7" />
        <text x="404" y="16" fill="#c084fc" font-size="11">ACTIVE</text>
      </g>
    </g>
  </g>
</svg>
