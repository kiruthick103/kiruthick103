<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <radialGradient id="univBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#140824" />
      <stop offset="60%" stop-color="#0a0314" />
      <stop offset="100%" stop-color="#040108" />
    </radialGradient>
    <filter id="softGlow2">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .u-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', monospace; }
    .hero-name { font-weight: 900; font-size: 13px; letter-spacing: 2px; }
    .hero-traits { font-size: 10.5px; font-weight: 600; letter-spacing: 1px; }
  </style>

  <rect width="880" height="340" rx="14" fill="url(#univBg)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Top Title -->
  <g transform="translate(30, 34)">
    <text x="0" y="4" fill="#ffffff" class="u-mono" font-size="15" font-weight="900" letter-spacing="3">⚡ MY UNIVERSE // ARCHETYPES OF ENGINEERING &amp; MIND</text>
    <text x="640" y="4" fill="#a855f7" class="u-mono" font-size="10.5" font-weight="700">INSPIRATION MATRIX</text>
  </g>

  <!-- Row 1 (Y: 60) -->

  <!-- Panel 1: BATMAN -->
  <g transform="translate(30, 60)">
    <rect width="260" height="115" rx="8" fill="#0d0917" stroke="#4c1d95" stroke-width="1.2" />
    <path d="M 0 0 L 16 0 L 0 16 Z" fill="#7c3aed" />
    <text x="18" y="28" fill="#c084fc" class="u-mono hero-name">🦇 BATMAN</text>
    <line x1="18" y1="38" x2="242" y2="38" stroke="#3b0764" stroke-width="1" />
    <text x="18" y="62" fill="#e2e8f0" class="u-mono hero-traits">Strategy • Logic • Preparation</text>
    <text x="18" y="86" fill="#94a3b8" class="u-mono" font-size="9.5">Architecting contingency protocols</text>
    <text x="18" y="102" fill="#94a3b8" class="u-mono" font-size="9.5">and zero-failure system stability.</text>
  </g>

  <!-- Panel 2: IRON MAN -->
  <g transform="translate(310, 60)">
    <rect width="260" height="115" rx="8" fill="#14080a" stroke="#b91c1c" stroke-width="1.2" />
    <path d="M 0 0 L 16 0 L 0 16 Z" fill="#ef4444" />
    <text x="18" y="28" fill="#f87171" class="u-mono hero-name">🦾 IRON MAN</text>
    <line x1="18" y1="38" x2="242" y2="38" stroke="#450a0a" stroke-width="1" />
    <text x="18" y="62" fill="#e2e8f0" class="u-mono hero-traits">Engineering • AI • Innovation</text>
    <text x="18" y="86" fill="#94a3b8" class="u-mono" font-size="9.5">Iterative rapid prototyping with</text>
    <text x="18" y="102" fill="#94a3b8" class="u-mono" font-size="9.5">autonomous AI pipelines and telemetry.</text>
  </g>

  <!-- Panel 3: SPIDER-MAN -->
  <g transform="translate(590, 60)">
    <rect width="260" height="115" rx="8" fill="#0c111e" stroke="#1d4ed8" stroke-width="1.2" />
    <path d="M 0 0 L 16 0 L 0 16 Z" fill="#3b82f6" />
    <text x="18" y="28" fill="#60a5fa" class="u-mono hero-name">🕷️ SPIDER-MAN</text>
    <line x1="18" y1="38" x2="242" y2="38" stroke="#172554" stroke-width="1" />
    <text x="18" y="62" fill="#e2e8f0" class="u-mono hero-traits">Adaptability • Learning</text>
    <text x="18" y="86" fill="#94a3b8" class="u-mono" font-size="9.5">Agile reflexes to embrace new stacks,</text>
    <text x="18" y="102" fill="#94a3b8" class="u-mono" font-size="9.5">learning with speed and resilience.</text>
  </g>

  <!-- Row 2 (Y: 195) -->

  <!-- Panel 4: DOCTOR STRANGE -->
  <g transform="translate(30, 195)">
    <rect width="260" height="115" rx="8" fill="#180e05" stroke="#d97706" stroke-width="1.2" />
    <path d="M 0 0 L 16 0 L 0 16 Z" fill="#f59e0b" />
    <text x="18" y="28" fill="#fbbf24" class="u-mono hero-name">🔮 DOCTOR STRANGE</text>
    <line x1="18" y1="38" x2="242" y2="38" stroke="#451a03" stroke-width="1" />
    <text x="18" y="62" fill="#e2e8f0" class="u-mono hero-traits">Problem Solving • Perspectives</text>
    <text x="18" y="86" fill="#94a3b8" class="u-mono" font-size="9.5">Analyzing 14 million possibilities</text>
    <text x="18" y="102" fill="#94a3b8" class="u-mono" font-size="9.5">to extract the optimal algorithm.</text>
  </g>

  <!-- Panel 5: GREEN LANTERN -->
  <g transform="translate(310, 195)">
    <rect width="260" height="115" rx="8" fill="#041810" stroke="#059669" stroke-width="1.2" />
    <path d="M 0 0 L 16 0 L 0 16 Z" fill="#10b981" />
    <text x="18" y="28" fill="#34d399" class="u-mono hero-name">💚 GREEN LANTERN</text>
    <line x1="18" y1="38" x2="242" y2="38" stroke="#022c22" stroke-width="1" />
    <text x="18" y="62" fill="#e2e8f0" class="u-mono hero-traits">Imagination • Willpower</text>
    <text x="18" y="86" fill="#94a3b8" class="u-mono" font-size="9.5">Transforming thoughts into code</text>
    <text x="18" y="102" fill="#94a3b8" class="u-mono" font-size="9.5">through sheer perseverance and craft.</text>
  </g>

  <!-- Panel 6: CYBORG -->
  <g transform="translate(590, 195)">
    <rect width="260" height="115" rx="8" fill="#041724" stroke="#0284c7" stroke-width="1.2" />
    <path d="M 0 0 L 16 0 L 0 16 Z" fill="#0ea5e9" />
    <text x="18" y="28" fill="#38bdf8" class="u-mono hero-name">⚙ CYBORG</text>
    <line x1="18" y1="38" x2="242" y2="38" stroke="#082f49" stroke-width="1" />
    <text x="18" y="62" fill="#e2e8f0" class="u-mono hero-traits">Human × Machine</text>
    <text x="18" y="86" fill="#94a3b8" class="u-mono" font-size="9.5">Merging human intuition with</text>
    <text x="18" y="102" fill="#94a3b8" class="u-mono" font-size="9.5">bionic compute and robotics interfaces.</text>
  </g>
</svg>
